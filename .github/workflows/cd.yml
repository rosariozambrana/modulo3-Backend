name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_backend_image: "ghcr.io/${{ github.repository_owner }}/modulo3-backend:latest"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # PASO 1: Configurar credenciales AWS
      # Terraform necesita acceso a AWS para crear recursos
      # ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ─────────────────────────────────────────
      # PASO 2: Instalar Terraform
      # ─────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # ─────────────────────────────────────────
      # PASO 3: Terraform Init
      # Descarga los plugins necesarios (proveedor AWS)
      # ─────────────────────────────────────────
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # ─────────────────────────────────────────
      # PASO 4: Terraform Plan
      # Muestra qué recursos va a crear/modificar (sin crear aún)
      # ─────────────────────────────────────────
      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan

      # ─────────────────────────────────────────
      # PASO 5: Terraform Apply
      # CREA LA INFRAESTRUCTURA AUTOMATICAMENTE
      # Si ya existe, la verifica y actualiza si es necesario
      # ─────────────────────────────────────────
      - name: Terraform Apply (Provisionar servidor)
        working-directory: ./terraform
        run: terraform apply -auto-approve

      # ─────────────────────────────────────────
      # PASO 6: Obtener nombre del ambiente EB desde Terraform
      # Necesitamos la URL y nombre del ambiente para el deploy
      # ─────────────────────────────────────────
      - name: Get Terraform outputs
        working-directory: ./terraform
        id: tf_outputs
        run: |
          echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
          echo "eb_env_name=$(terraform output -raw eb_environment_name 2>/dev/null || echo '${{ secrets.EB_ENVIRONMENT_NAME }}')" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      # PASO 7: Crear Dockerrun.aws.json
      # Le dice a Elastic Beanstalk qué imagen Docker usar
      # ─────────────────────────────────────────
      - name: Prepare Docker deployment package
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${{ github.repository_owner }}/modulo3-backend:sha-${SHORT_SHA}"
          echo "Deploying image: $IMAGE"

          cat > Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${IMAGE}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "8080",
                "HostPort": "80"
              }
            ]
          }
          EOF

          cat Dockerrun.aws.json
          zip deploy.zip Dockerrun.aws.json

      # ─────────────────────────────────────────
      # PASO 8: Deploy a Elastic Beanstalk
      # EB descargará la imagen de ghcr.io y la correrá
      # ─────────────────────────────────────────
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: docker-${{ github.event.workflow_run.head_sha }}-${{ github.run_number }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip
          use_existing_version_if_available: true

      # ─────────────────────────────────────────
      # PASO 9: Smoke Test
      # Verifica que la API responde correctamente
      # ─────────────────────────────────────────
      - name: Smoke test deployed environment
        run: |
          # La URL viene directamente del output de Terraform — no necesitas actualizarla manualmente
          URL="${{ steps.tf_outputs.outputs.backend_url }}"
          echo "Waiting for the API to respond at $URL ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Smoke test passed (HTTP $STATUS) - API is running"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "❌ Smoke test failed: API did not respond"
          exit 1

      - name: Deployment successful
        run: |
          # La URL viene directamente del output de Terraform
          echo "✅ Backend deployed via Docker image con IaC!"
          echo "Image: ghcr.io/${{ github.repository_owner }}/modulo3-backend:latest"
          echo "URL: ${{ steps.tf_outputs.outputs.backend_url }}"