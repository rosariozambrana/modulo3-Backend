name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════
  # JOB 1: validate
  # Verifica que el código compila sin errores
  # ═══════════════════════════════════════════
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Display Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: 4. Install project dependencies
        run: npm ci

      - name: 5. Generate Prisma client
        run: npx prisma generate

      - name: 6. Validate TypeScript compilation
        run: npx tsc --noEmit
        continue-on-error: true

  # ═══════════════════════════════════════════
  # JOB 2: build
  # Compila TypeScript y genera el artefacto
  # ═══════════════════════════════════════════
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install project dependencies
        run: npm ci

      - name: 4. Generate Prisma client
        run: npx prisma generate

      - name: 5. Build project for production
        run: npm run build

      - name: 6. Verify build output
        run: |
          echo "Checking build output..."
          ls -lah dist/
          echo "Main entry point:"
          ls -lah dist/server.js

      - name: 7. Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            dist/
            package.json
            package-lock.json
            prisma/
          if-no-files-found: error
          retention-days: 1
