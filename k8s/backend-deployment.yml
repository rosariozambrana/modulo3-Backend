apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/rosariozambrana/modulo3-backend:latest

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: NODE_ENV
              value: "production"

            - name: CORS_ORIGIN
              value: "*"

            - name: DATABASE_URL
              value: "postgresql://postgres:TU_PASSWORD@TU_HOST_RDS.us-east-1.rds.amazonaws.com:5432/postgres?schema=public"

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
